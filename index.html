<!DOCTYPE html>
<html lang="it" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Famiglia Giuganino</title>
<style>
:root{--bg:#f6f7f5;--fg:#0e1a17;--mut:#62706b;--card:#fff;--ln:#d9e0dc;--acc:#0b6b5d;--gold:#b8892b;--m:#e6f1ee;--f:#f7ebee;--g:rgba(11,107,93,.13);--sh:0 1px 2px rgba(10,30,25,.06),0 18px 40px -18px rgba(10,30,25,.25)}
:root[data-t=dark]{--bg:#080d0c;--fg:#e8efec;--mut:#8ba09a;--card:#111a18;--ln:#25322e;--acc:#5fd3bf;--gold:#e2c275;--m:#10262a;--f:#2a1a22;--g:rgba(95,211,191,.14);--sh:0 1px 2px #0008,0 20px 44px -18px #000}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(55% 45% at 12% 0,var(--g),transparent),radial-gradient(45% 40% at 95% 8%,rgba(184,137,43,.10),transparent)}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:7px 14px;transition:border-color .2s,transform .2s,background .2s}
button{cursor:pointer}button:hover{border-color:var(--acc);transform:translateY(-1px)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:500;letter-spacing:-.01em}
#lg{position:relative;display:grid;place-items:center;min-height:100vh;overflow:hidden}
#lg::before,#lg::after{content:"";position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(60px);animation:dr 16s ease-in-out infinite alternate}
#lg::before{background:var(--g);left:-15vmax;top:-20vmax}
#lg::after{background:rgba(184,137,43,.18);right:-20vmax;bottom:-25vmax;animation-delay:-8s}
#lg form{position:relative;z-index:1;display:grid;gap:14px;width:min(360px,88vw);padding:34px;border:1px solid var(--ln);border-radius:24px;background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(18px);box-shadow:var(--sh);animation:up .8s cubic-bezier(.2,.7,.2,1) both}
#lg h1{font-size:36px;margin:0;line-height:1.1;background:linear-gradient(120deg,var(--fg),var(--acc) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
#lf button{background:var(--acc);color:var(--bg);border-color:transparent}
#er{color:#c2452f;min-height:1.2em;margin:0}
@keyframes dr{to{transform:translate3d(4%,-5%,0) scale(1.1)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes sl{from{opacity:0;transform:translateX(24px)}}
#pb{position:fixed;top:0;left:0;height:3px;width:0;z-index:9;background:linear-gradient(90deg,var(--acc),var(--gold))}
#top{position:fixed;inset:0 0 auto;z-index:6;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--ln)}
#nv,#tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px}
#tb{border-top:1px solid var(--ln)}
#ttl{font:500 20px "Iowan Old Style",Palatino,Georgia,serif;margin-right:10px}
#ttl::after{content:"";display:inline-block;width:7px;height:7px;margin-left:4px;border-radius:50%;background:var(--gold)}
.sp{margin-right:auto}
#tabs button{border:0;background:none;border-radius:8px;padding:6px 10px;color:var(--mut);position:relative;transform:none}
#tabs button.on,#tabs button:hover{color:var(--fg)}
#tabs button::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--gold));transform:scaleX(0);transition:transform .35s}
#tabs button.on::after{transform:scaleX(1)}
#v{position:fixed;inset:var(--hh,100px) 0 0;touch-action:none;cursor:grab;background:radial-gradient(var(--ln) 1px,transparent 1.2px) 0 0/24px 24px}
#v:active{cursor:grabbing}
#s{width:100%;height:100%;display:block}
#s g[data-id] rect{transition:stroke .2s,stroke-width .2s}
#s g[data-id]:hover rect{stroke:var(--acc);stroke-width:2.5}
#p{position:fixed;right:12px;top:calc(var(--hh,100px) + 8px);bottom:12px;width:min(390px,calc(100% - 24px));overflow:auto;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:20px;box-shadow:var(--sh);padding:18px;z-index:5;animation:sl .35s cubic-bezier(.2,.7,.2,1)}
#p h2{margin:6px 0}
#p label{display:block;margin:8px 0;color:var(--mut);font-size:13px}
#p label input:not([type=checkbox]),#p label select,#p label textarea{display:block;width:100%;margin-top:3px;font-size:15px;border-radius:12px}
#p img{width:96px;height:96px;object-fit:cover;border-radius:50%;display:block;margin-top:8px;box-shadow:var(--sh)}
.u{border:1px solid var(--ln);border-radius:14px;padding:10px;margin:8px 0;display:grid;gap:6px}
.u a{cursor:pointer;color:var(--acc);margin-right:8px;text-decoration:underline}
#pg{position:fixed;inset:0;overflow:auto;padding:calc(var(--hh,100px) + 28px) 18px 80px}
#pg.fd{animation:up .6s cubic-bezier(.2,.7,.2,1)}
#pg article{max-width:720px;margin:auto}
#pg h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:.2em 0}
#pg h2{font-size:24px;margin:1.6em 0 .3em}
#pg p{margin:.7em 0}#pg a{color:var(--acc)}
#pg .b{position:relative}
#pg .ph{max-width:100%;height:auto;border-radius:14px;box-shadow:var(--sh);margin:8px 0;transition:transform .4s}
#pg .ph:hover{transform:scale(1.03) rotate(-.6deg)}
#pg .x{position:absolute;right:0;top:0;padding:1px 8px;z-index:1}
#pg [contenteditable]{outline:1px dashed var(--ln);padding:2px 6px;border-radius:6px}
.pic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;color:var(--card);background:linear-gradient(135deg,var(--acc),var(--gold));box-shadow:0 10px 24px -10px var(--acc)}
.pic svg{width:28px;height:28px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.hero{position:relative;max-width:1080px;margin:0 auto;min-height:60vh;display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:center;padding:10px 0 40px}
.hero::before{content:"";position:absolute;inset:-10% -20%;z-index:-1;background:radial-gradient(circle at 25% 40%,var(--g),transparent 45%),radial-gradient(circle at 80% 65%,rgba(184,137,43,.16),transparent 40%);filter:blur(12px);animation:dr 18s ease-in-out infinite alternate}
.hero h1{font-size:clamp(40px,7vw,84px);line-height:1;margin:0 0 .3em;padding-bottom:.08em;background:linear-gradient(120deg,var(--fg) 25%,var(--acc) 65%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,2vw,21px);color:var(--mut);max-width:34em}
.polaroid{justify-self:center;width:min(300px,70%);border-radius:4px;box-shadow:var(--sh);rotate:-4deg;translate:0 calc(var(--sy,0) * -.05px);transition:rotate .5s}
.polaroid:hover{rotate:0deg}
.grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid>div{display:grid}
.card{position:relative;overflow:hidden;display:block;padding:22px;border:1px solid var(--ln);border-radius:22px;background:var(--card);color:inherit!important;text-decoration:none;box-shadow:var(--sh);transition:transform .3s,border-color .3s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--g),transparent 70%);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);border-color:var(--acc)}.card:hover::before{opacity:1}
.card>*{position:relative}
.card small{display:block;margin-top:16px;color:var(--acc);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.card h3{font-size:22px;margin:2px 0 4px;line-height:1.25}.card p{margin:0;color:var(--mut);font-size:15px}
.card i{position:absolute;right:20px;top:22px;font-style:normal;color:var(--acc);transition:transform .3s}.card:hover i{transform:translateX(4px)}
@media(max-width:700px){#p{inset:auto 8px 8px;height:72vh;width:auto}.hero{grid-template-columns:1fr}}
@media print{#top,#p,#pb{display:none!important}:root,:root[data-t]{--bg:#fff;--fg:#000;--card:#fff;--ln:#999;--mut:#555;--m:#e6f1ee;--f:#f7ebee}body::before{display:none}#v,#pg{inset:0}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="lg">
 <form id="lf">
  <h1>Famiglia Giuganino</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button>Entra</button>
  <p id="er"></p>
 </form>
</div>
<div id="app" hidden>
 <i id="pb"></i><div id="top">
  <nav id="nv"><b id="ttl">Giuganino</b><span id="tabs"></span><span class="sp"></span>
   <button id="ed">Modifica testi</button><button id="th">Tema</button><button id="ex">Esporta dati</button><button id="im">Importa dati</button><input id="imf" type="file" hidden><button id="ou">Esci</button></nav>
  <header id="tb">
   <select id="rt" title="Mostra i discendenti di"></select>
   <input id="q" list="dl" placeholder="Cerca persona" size="14"><datalist id="dl"></datalist>
   <button id="zo" title="Riduci">−</button><button id="zi" title="Ingrandisci">+</button><button id="ft">Adatta</button>
   <button id="pn">+ Persona</button><button id="gp">PNG</button><button id="gf">PDF</button>
  </header>
 </div>
 <div id="v"></div>
 <main id="pg" hidden></main>
 <aside id="p" hidden></aside>
</div>

 await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),
 {name:'AES-GCM',length:256},true,['encrypt','decrypt']);
const dec=async(b,k)=>JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:U8(b.iv)},k,U8(b.data))));
const enc=async o=>{const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(o)));
 return{salt:sl,iv:B(iv),data:B(ct)}};
let tm;const save=()=>{clearTimeout(tm);tm=setTimeout(async()=>{ls('giu',JSON.stringify({...await enc(DB),base:ENC.iv}))},400)};

// Sblocca: prima i dati locali (modifiche salvate nel browser), poi il file del sito
async function unlock(pw){
 const L=lg('giu')?JSON.parse(lg('giu')):null;
 for(const b of L?[L,ENC]:[ENC]){
  try{
   const k=pw?await dk(pw,U8(b.salt)):await crypto.subtle.importKey('jwk',JSON.parse(sg('k')),'AES-GCM',true,['encrypt','decrypt']);
   DB=await dec(b,k);key=k;sl=b.salt;
   if(b===L&&L.base!=ENC.iv&&confirm('Esiste una versione più recente del file dati. Usarla? (le modifiche non esportate andranno perse)')){try{DB=await dec(ENC,k)}catch(e){}}
   // se i dati caricati non hanno le sezioni del sito (file o copia locale vecchi), le prendo dalla versione più recente
   if(!(DB.sito&&DB.sito.pagine&&DB.sito.pagine.length)){for(const o of[ENC,ENC0]){try{const F=await dec(o,pw?await dk(pw,U8(o.salt)):k);if(F.sito&&F.sito.pagine.length){DB.sito=F.sito;save();break}}catch(e){}}}
   if(!pw&&!(DB.sito&&DB.sito.pagine&&DB.sito.pagine.length))continue;
   ss('k',JSON.stringify(await crypto.subtle.exportKey('jwk',k)));return true;
  }catch(e){}
 }
 return false;
}

// ---------- Modello ----------
const P=id=>DB.persone.find(p=>p.id==id);
const nm=p=>p?((p.nome||'?')+' '+(p.cognome||'')).trim():'?';
const yr=p=>p.deceduto?`${p.nascita||'?'} – ${p.morte||'†'}`:(p.nascita||'');
const U=id=>DB.unioni.filter(u=>u.partner1==id||u.partner2==id);
const PU=id=>DB.unioni.find(u=>u.figli.includes(id));
const all=()=>[...DB.persone].sort((a,b)=>nm(a).localeCompare(nm(b)));
const np=o=>{const p={id:'n'+(++cnt)+Date.now().toString(36),nome:'',cognome:'',cognome_nubile:null,sesso:'',nascita:'',morte:'',deceduto:false,luogo_nascita:null,luogo_morte:null,professione:null,contatti:null,note:null,fonti:[],...o};DB.persone.push(p);return p};

// ---------- Layout albero (discendenti dall'alto verso il basso) ----------
const W=128,H=56,G=14,V=76;
function node(id,seen){
 seen.add(id);const sp=[];let kids=[];
 U(id).forEach(u=>{const o=u.partner1==id?u.partner2:u.partner1;
  if(o&&!seen.has(o)){seen.add(o);sp.push({id:o,u})}
  u.figli.forEach(c=>{if(!seen.has(c))kids.push(c)})});
 kids=[...new Set(kids)];
 return{ppl:[{id},...sp],ch:kids.map(c=>node(c,seen))};
}
const nw=n=>n.ppl.length*(W+G)-G;
const meas=n=>(n.sw=Math.max(nw(n),n.ch.reduce((a,c)=>a+meas(c)+G,-G)));
const place=(n,x,y)=>{n.y=y;n.x=x+(n.sw-nw(n))/2;let cx=x;n.ch.forEach(c=>{place(c,cx,y+H+V);cx+=c.sw+G})};
const cut=s=>s.length>19?s.slice(0,18)+'…':s;
const card=(id,x,y)=>{const p=P(id);return`<g data-id="${id}" transform="translate(${x},${y})" style="cursor:pointer"><rect width="${W}" height="${H}" rx="10" style="fill:var(--${p.sesso=='F'?'f':'m'});stroke:var(--ln);opacity:${p.deceduto?.8:1}"/><text x="${W/2}" y="19" text-anchor="middle" font-size="12.5" style="fill:var(--fg)">${esc(cut(p.nome||'?'))}</text><text x="${W/2}" y="34" text-anchor="middle" font-size="12.5" font-weight="600" style="fill:var(--fg)">${esc(cut(p.cognome||''))}</text><text x="${W/2}" y="49" text-anchor="middle" font-size="10.5" style="fill:var(--mut)">${esc(yr(p))}</text></g>`};
const ln=(a,b,c,d,dash)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" style="stroke:var(--ln)" stroke-width="1.5"${dash?' stroke-dasharray="4 3"':''}/>`;
function draw(n,o,m){
 m.h=Math.max(m.h,n.y+H);
 n.ppl.forEach((p,i)=>{const x=n.x+i*(W+G);o.push(card(p.id,x,n.y));
  if(i)o.push(ln(x-G,n.y+H/2,x,n.y+H/2,p.u.tipo!='coniugi'))});
 if(!n.ch.length)return;
 const gx=n.x+nw(n)/2,ym=n.y+H+V/2;
 o.push(ln(gx,n.y+H,gx,ym));
 n.ch.forEach(c=>{const cx=c.x+nw(c)/2;o.push(ln(gx,ym,cx,ym),ln(cx,ym,cx,c.y));draw(c,o,m)});
}
const setvb=()=>$('#s').setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
// vista iniziale: carte leggibili, centrate sul capostipite ("Adatta" mostra tutto)
const ini=()=>{const s=$('#s'),w=Math.min(fb.w,1300);vb={x:fb.x+fb.w/2-w/2,y:fb.y,w,h:w*(s.clientHeight||600)/(s.clientWidth||1000)}};
function render(fit){
 $('#rt').innerHTML=all().map(p=>`<option value="${p.id}" ${p.id==root?'selected':''}>${esc(nm(p))} ${esc(p.nascita||'')}</option>`).join('');
 $('#dl').innerHTML=all().map(p=>`<option value="${esc(nm(p)+' '+(p.nascita||''))}">`).join('');
 const n=node(root,new Set());meas(n);place(n,0,0);const o=[],m={h:0};draw(n,o,m);
 fb={x:-20,y:-20,w:n.sw+40,h:m.h+40};
 $('#v').innerHTML=`<svg id="s" xmlns="http://www.w3.org/2000/svg" font-family="Iowan Old Style,Palatino,Georgia,serif">${o.join('')}</svg>`;
 if(fit||!vb)ini();setvb();
}

let pd=null,mv=0;const v=$('#v');
v.onpointerdown=e=>{pd={x:e.clientX,y:e.clientY};mv=0};
window.onpointermove=e=>{if(!pd)return;const s=$('#s'),k=Math.max(vb.w/s.clientWidth,vb.h/s.clientHeight),dx=e.clientX-pd.x,dy=e.clientY-pd.y;
 mv+=Math.abs(dx)+Math.abs(dy);vb.x-=dx*k;vb.y-=dy*k;pd={x:e.clientX,y:e.clientY};setvb()};
window.onpointerup=()=>pd=null;

v.onclick=e=>{if(mv>5)return;const g=e.target.closest('[data-id]');if(g)open(g.dataset.id)};

// ---------- Scheda persona (tutto modificabile) ----------
const F=[['nome','Nome'],['cognome','Cognome'],['cognome_nubile','Cognome da nubile'],['nascita','Nascita (gg/mm/aaaa)'],['luogo_nascita','Luogo di nascita'],['morte','Morte (gg/mm/aaaa)'],['luogo_morte','Luogo di morte'],['professione','Professione'],['contatti','Contatti'],['fonti','Fonti / documenti']];
const ops=(cur,none)=>`<option value="">${none}</option>`+all().map(q=>`<option value="${q.id}" ${q.id==cur?'selected':''}>${esc(nm(q))} ${esc(q.nascita||'')}</option>`).join('');
function open(id){
 sel=id;const p=P(id),pu=PU(id);
 $('#p').innerHTML=`<button data-a="x" style="float:right">✕</button><h2>${esc(nm(p))}</h2>
 ${p.foto?`<img src="${p.foto}" alt="">`:''}<label>Foto<input id="ph" type="file" accept="image/*"></label>
 ${F.map(([k,l])=>`<label>${l}<input data-k="${k}" value="${esc(Array.isArray(p[k])?p[k].join('; '):p[k])}"></label>`).join('')}
 <label>Sesso<select data-k="sesso">${[['','—'],['M','Maschio'],['F','Femmina']].map(([a,b])=>`<option value="${a}" ${p.sesso==a?'selected':''}>${b}</option>`).join('')}</select></label>
 <label><input type="checkbox" data-k="deceduto" ${p.deceduto?'checked':''}> Deceduto/a</label>
 <label>Note<textarea data-k="note" rows="3">${esc(p.note)}</textarea></label>
 <label>Figlio/a di<select data-a="par"><option value="">—</option>${DB.unioni.map(u=>`<option value="${u.id}" ${pu&&pu.id==u.id?'selected':''}>${esc(nm(P(u.partner1))+' + '+nm(P(u.partner2)))}</option>`).join('')}<optgroup label="Solo un genitore">${all().filter(q=>q.id!=id&&!U(q.id).length).map(q=>`<option value="p:${q.id}">${esc(nm(q))} ${esc(q.nascita||'')}</option>`).join('')}</optgroup></select></label>
 <h2 style="margin-top:14px;font-size:18px">Unioni</h2>
 ${U(id).map(u=>`<div class="u"><select data-a="tipo" data-u="${u.id}">${['coniugi','divorziati','conviventi'].map(t=>`<option ${u.tipo==t?'selected':''}>${t}</option>`).join('')}</select>
  <select data-a="prt" data-u="${u.id}">${ops(u.partner1==id?u.partner2:u.partner1,'— partner —')}<option value="__new">➕ Nuova persona</option></select>
  <div>${u.figli.map(c=>`<a data-o="${c}">${esc(nm(P(c)))}</a>`).join('')||'<span style="color:var(--mut)">Nessun figlio</span>'}</div>
  <button data-a="fig" data-u="${u.id}">+ Figlio/a</button></div>`).join('')}
 <p>${U(id).length?'':'<button data-a="figs">+ Figlio/a</button> '}<button data-a="uni">+ Unione</button> <button data-a="root">Mostra i suoi discendenti</button> <button data-a="del">Elimina persona</button></p>`;
 $('#p').hidden=false;
}
const done=()=>{save();render(false);open(sel)};
$('#p').onchange=e=>{
 const t=e.target,d=t.dataset,p=P(sel);
 if(d.k){p[d.k]=t.type=='checkbox'?t.checked:t.value;save();render(false);return}
 if(t.id=='ph'){const f=t.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,240/Math.max(im.width,im.height));
   c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);p.foto=c.toDataURL('image/jpeg',.75);done()};im.src=r.result};
  r.readAsDataURL(f);return}
 if(d.a=='par'){DB.unioni.forEach(u=>u.figli=u.figli.filter(c=>c!=sel));if(t.value.startsWith('p:'))DB.unioni.push({id:'u'+Date.now().toString(36),partner1:t.value.slice(2),partner2:null,tipo:'coniugi',figli:[sel]});else if(t.value)DB.unioni.find(u=>u.id==t.value).figli.push(sel)}
 if(d.a=='tipo')DB.unioni.find(u=>u.id==d.u).tipo=t.value;
 if(d.a=='prt'){const u=DB.unioni.find(x=>x.id==d.u),val=t.value=='__new'?np().id:t.value;u[u.partner1==sel?'partner2':'partner1']=val||null}
 done();
};
$('#p').onclick=e=>{
 const d=e.target.dataset,p=P(sel);
 if(d.o)return open(d.o);
 if(d.a=='x')$('#p').hidden=true;
 if(d.a=='fig'){const c=np({cognome:p.cognome});DB.unioni.find(u=>u.id==d.u).figli.push(c.id);sel=c.id;done()}
 if(d.a=='figs'){const c=np({cognome:p.cognome});DB.unioni.push({id:'u'+Date.now().toString(36),partner1:sel,partner2:null,tipo:'coniugi',figli:[c.id]});sel=c.id;done()}
 if(d.a=='uni'){DB.unioni.push({id:'u'+Date.now().toString(36),partner1:sel,partner2:null,tipo:'coniugi',figli:[]});done()}
 if(d.a=='root'){root=sel;render(true)}
 if(d.a=='del'&&confirm('Eliminare '+nm(p)+'?')){
  DB.persone=DB.persone.filter(x=>x.id!=sel);
  DB.unioni.forEach(u=>{u.figli=u.figli.filter(c=>c!=sel);['partner1','partner2'].forEach(k=>{if(u[k]==sel)u[k]=null})});
  DB.unioni=DB.unioni.filter(u=>u.partner1||u.partner2||u.figli.length);
  if(root==sel)root=DB.persone[0].id;$('#p').hidden=true;save();render(true)}
};

// ---------- Sezioni del sito: testi e immagini modificabili ----------
let view='home',edt=false;

 $('#tabs').innerHTML=t.map(([i,n])=>`<button data-v="${i}" class="${i==view?'on':''}">${esc(n)}</button>`).join('')}
const IC={storia:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',

araldica:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v7M9 11h6"/>',
news:'<path d="M4 4h12a1 1 0 0 1 1 1v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2M8 8h5M8 12h5M8 16h3"/>',
contatti:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7.5 8.5 6 8.5-6"/>'};

function show(id){view=id;const a=id=='albero';tabs();
 $('#v').hidden=!a;$('#tb').hidden=!a;$('#pg').hidden=a;$('#ed').hidden=a;
 if(!a)$('#p').hidden=true;layout();
 if(a){$('#pb').style.width=0;render(!vb)}else{const g=$('#pg');g.scrollTop=0;g.classList.remove('fd');void g.offsetWidth;g.classList.add('fd');page()}}
const blk=(b,i)=>{const x=edt?`<button class="x" data-x="${i}" title="Elimina">✕</button>`:'',d=`style="--d:${i%5*60}ms"`;
 if(b.ic)return`<div class="b rv" ${d}>${x}<span class="pic">${svg(b.ic)}</span></div>`;
 if(b.t=='i')return`<div class="b rv" ${d}>${x}<img class="ph" src="${b.s}" alt=""></div>`;
 const g={t:'h1',h:'h2'}[b.t]||'p';
 return`<div class="b rv" ${d}>${x}<${g} data-i="${i}"${edt?' contenteditable':''}>${edt?esc(b.x):lk(b.x)}</${g}></div>`};

 // ogni scheda: titolo (riga prima dell'icona) + testo (righe dopo l'icona, fino al titolo successivo)

 return`<section class="hero"><div><h1 class="rv">${esc(tx[0]?.x)}</h1><p class="lead rv" style="--d:120ms">${tx.slice(1).map(b=>lk(b.x)).join(' ')}</p></div>${ph?`<img class="polaroid rv" style="--d:240ms" src="${ph.s}" alt="">`:''}</section>
 <section class="grid">${cs.map((c,i)=>`<div class="rv" style="--d:${i*80}ms"><a class="card" href="#${c.ic}" data-v="${c.ic}"><span class="pic">${svg(c.ic)}</span><small>${NM[c.ic]||''}</small><h3>${esc(c.x[0]||'')}</h3><p>${esc(c.x.slice(1).join(' '))}</p><i>→</i></a></div>`).join('')}</section>`}

  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  pgd().blocchi.push({t:'i',s:c.toDataURL('image/jpeg',.8)});save();page()};im.src=r.result};r.readAsDataURL(f)};
